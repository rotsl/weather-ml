name: Auto Retrain + Publish Dashboard

on:
  schedule:
    # Every 48 hours at 02:00 UTC
    - cron: "0 2 */2 * *"

  workflow_dispatch:


# Prevent overlapping runs (quota safety)
concurrency:
  group: retrain-weather
  cancel-in-progress: false


permissions:
  contents: write


jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:

    # ============================
    # Checkout
    # ============================
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    # ============================
    # Python
    # ============================
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    # ============================
    # Dependencies
    # ============================
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    # ============================
    # Debug (optional, keep for now)
    # ============================
    - name: Debug environment
      run: |
        pwd
        ls -la
        ls -la scripts || true
        ls -la data/processed || true
        ls -la models || true
        ls -la docs || true


    # ============================
    # Retrain
    # ============================
    - name: Update data + retrain
      env:
        VISUAL_CROSSING_KEY: ${{ secrets.VISUAL_CROSSING_KEY }}
        VISUAL_CROSSING_LOCATION: ${{ secrets.VISUAL_CROSSING_LOCATION }}
      run: |
        echo "Starting retrain..."
        python -u scripts/update_data_and_retrain.py


    # ============================
    # Export Dashboard (NEW)
    # ============================
    - name: Build dashboard HTML
      run: |
        python scripts/export_dashboard_html.py


    # ============================
    # Update README
    # ============================
    - name: Update README
      env:
        ENABLE_LIVE_FORECAST: "0"
      run: |
        python scripts/update_readme.py

    # ----------------------------
    # Update Changelog
    # ----------------------------
    - name: Update changelog
      run: |
        python scripts/update_changelog.py     

    # ============================
    # Monthly Report
    # ============================
    - name: Generate monthly report
      run: |
        python scripts/monthly_report.py
        
    # ============================
    # Commit
    # ============================
    - name: Commit updated artifacts
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git status

        git add models/
        git add data/processed/
        git add docs/
        git add README.md

        git commit -m "Auto retrain + dashboard update ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "No changes"

        git push

    # ----------------------------
    # Mirror to GitLab
    # ----------------------------
    - name: Push to GitLab mirror
      run: |
        git remote remove gitlab || true

        git remote add gitlab https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@gitlab.com/${{ secrets.GITLAB_USERNAME }}/weather-ml.git

        git push gitlab main --force   
