name: Auto Retrain Weather Model

on:
  schedule:
    # Every 48 hours at 02:00 UTC
    - cron: "0 2 */2 * *"

  workflow_dispatch:   # allows manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run retraining
        env:
          VISUAL_CROSSING_KEY: ${{ secrets.VISUAL_CROSSING_KEY }}
          VISUAL_CROSSING_LOCATION: ${{ secrets.VISUAL_CROSSING_LOCATION }}
        run: |
          python scripts/update_data_and_retrain.py

      - name: Commit updated models
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add models/

          git commit -m "Auto retrain: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"

          git push
