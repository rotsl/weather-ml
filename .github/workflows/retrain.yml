name: Auto Retrain Weather Model

on:
  schedule:
    # Every 48 hours at 02:00 UTC
    - cron: "0 2 */2 * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for pushing back


      # ----------------------------
      # Python
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ----------------------------
      # Dependencies
      # ----------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ----------------------------
      # Debug Environment
      # ----------------------------
      - name: Debug environment
        run: |
          echo "PWD:"
          pwd

          echo "Root contents:"
          ls -la

          echo "Scripts:"
          ls -la scripts || true

          echo "Data:"
          ls -la data || true
          ls -la data/processed || true

          echo "Models:"
          ls -la models || true


      # ----------------------------
      # Run Retraining
      # ----------------------------
      - name: Run retraining
        env:
          VISUAL_CROSSING_KEY: ${{ secrets.VISUAL_CROSSING_KEY }}
          VISUAL_CROSSING_LOCATION: ${{ secrets.VISUAL_CROSSING_LOCATION }}
        run: |
          echo "Starting retrain..."
          python -u scripts/update_data_and_retrain.py

      # ----------------------------
      # Update README
      # ----------------------------
      - name: Update README
        env:
          VISUAL_CROSSING_KEY: ${{ secrets.VISUAL_CROSSING_KEY }}
          VISUAL_CROSSING_LOCATION: ${{ secrets.VISUAL_CROSSING_LOCATION }}
        run: |
          python scripts/update_readme.py
      # ----------------------------
      # Commit Results
      # ----------------------------
      - name: Commit updated data and models
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          echo "Git status:"
          git status

          git add models/
          git add data/processed/
          git add README.md

          git commit -m "Auto retrain: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"

          git push
